name: CI

on:
  push:
    branches: [master]
  pull_request:

# Avbryt tidligere kjøringer for samme branch/PR når det pushes på nytt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Leser .node-version, samme fil som Netlify og Render bruker,
          # slik at CI og produksjon ikke kan drifte fra hverandre.
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build klient
        run: npm run build:client

      - name: Build server
        run: npm run build:server

  # Fletter Dependabot-PR-er automatisk når CI er grønn, men bare minor- og
  # patch-oppdateringer. Major-hopp (også sikkerhetsoppdateringer som er
  # major) blir liggende for manuell testing, i tråd med dependabot.yml.
  # Flettes direkte i stedet for med "gh pr merge --auto", slik at det ikke
  # krever branch protection eller "Allow auto-merge" i repoet.
  dependabot-fletting:
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
