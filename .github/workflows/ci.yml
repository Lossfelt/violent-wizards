name: CI

on:
  push:
    branches: [master]
  pull_request:

# Avbryt tidligere kjøringer for samme branch/PR når det pushes på nytt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build klient
        run: npm run build:client

      - name: Build server
        run: npm run build:server
